<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-300 to-blue-300 min-h-screen flex items-center justify-center">
  <form action="/login" method="POST" class="bg-white p-8 rounded-2xl shadow-xl w-96">
    <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">Welcome Back</h2>
    <input type="email" name="email" placeholder="Email" required class="w-full p-3 mb-4 border rounded-lg">
    <input type="password" name="password" placeholder="Password" required class="w-full p-3 mb-4 border rounded-lg">
    <button class="bg-indigo-600 text-white w-full py-3 rounded-lg hover:bg-indigo-700">Login</button>
    <p class="text-sm text-center mt-4">Don't have an account? <a href="/signup.html" class="text-indigo-600">Sign Up</a></p>
  </form>
</body>
</html>
