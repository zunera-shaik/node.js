<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-300 to-pink-300 min-h-screen flex items-center justify-center">
  <form action="/signup" method="POST" class="bg-white p-8 rounded-2xl shadow-xl w-96">
    <h2 class="text-2xl font-bold text-center text-purple-700 mb-6">Create Account</h2>
    <input type="email" name="email" placeholder="Email" required class="w-full p-3 mb-4 border rounded-lg">
    <input type="password" name="password" placeholder="Password" required class="w-full p-3 mb-4 border rounded-lg">
    <button class="bg-purple-600 text-white w-full py-3 rounded-lg hover:bg-purple-700">Sign Up</button>
    <p class="text-sm text-center mt-4">Already have an account? <a href="/login.html" class="text-purple-600">Login</a></p>
  </form>
</body>
</html>
